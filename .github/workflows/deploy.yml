name: Deploy to Vercel

# Every push to main publishes the site to Tamir's Vercel project (dr-tamir.vercel.app).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_mMljoSFp6JAgiG119U4BlfTg
      VERCEL_PROJECT_ID: prj_67DysOLabPIDzMxKjiNJTvdgK90h
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check for the Vercel token
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set yet; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: npx --yes vercel@65.2.0 deploy --prod --yes --token="$VERCEL_TOKEN"
